# File: examples/dashboard.yaml
# Timestamp: 2026-08-10 22:50 CEST
# Solar Energy Controller 0.1.3 - simulation dashboard

title: Solar Energy Controller
views:
  - title: Simulation
    path: simulation
    icon: mdi:solar-power-variant
    cards:
      - type: markdown
        content: |
          # 🟢 SIMULATION AKTIV
          **Keine Gerätesteuerung.** Der Controller beobachtet den realen Betrieb und führt parallel einen virtuellen Schattenbetrieb aus.

      - type: entities
        title: Controller
        show_header_toggle: false
        entities:
          - switch.solar_energy_controller_simulation
          - sensor.solar_energy_controller_recommended_mode
          - sensor.solar_energy_controller_simulated_battery_soc
          - sensor.solar_energy_controller_target_battery_soc
          - sensor.solar_energy_controller_effective_export_price
          - sensor.solar_energy_controller_mining_break_even_export_price
          - sensor.solar_energy_controller_future_minimum_epex_price
          - sensor.solar_energy_controller_future_maximum_epex_price

      - type: glance
        title: Wirtschaftlichkeit heute
        columns: 3
        entities:
          - entity: sensor.solar_energy_controller_simulated_net_benefit_today
            name: Simulation
          - entity: sensor.solar_energy_controller_observed_net_benefit_today
            name: Ist
          - entity: sensor.solar_energy_controller_simulation_advantage_today
            name: Vorteil

      - type: entities
        title: PV-Prognose für die Entscheidung
        entities:
          - entity: sensor.solar_energy_controller_pv_forecast_today
            name: Heute gesamt
          - entity: sensor.solar_energy_controller_pv_forecast_remaining_today
            name: Rest heute
          - entity: sensor.solar_energy_controller_pv_forecast_tomorrow
            name: Morgen gesamt
          - entity: sensor.solar_energy_controller_pv_forecast_next_hour
            name: Nächste Stunde

      - type: entities
        title: Simulierte Energieflüsse
        entities:
          - sensor.solar_energy_controller_simulated_export_power
          - sensor.solar_energy_controller_simulated_import_power
          - sensor.solar_energy_controller_simulated_battery_charge_power
          - sensor.solar_energy_controller_simulated_battery_discharge_power
          - sensor.solar_energy_controller_simulated_export_energy_today
          - sensor.solar_energy_controller_simulated_import_energy_today
          - sensor.solar_energy_controller_simulated_export_revenue_today
          - sensor.solar_energy_controller_simulated_self_consumption_saving_today

      - type: entities
        title: Mining – DOGE
        entities:
          - entity: switch.steckdose_mining
            name: Miner tatsächlich
          - entity: sensor.steckdose_mining_power
            name: Miner Leistung
          - sensor.solar_energy_controller_simulated_miner_runtime_today
          - sensor.solar_energy_controller_simulated_doge_today
          - sensor.solar_energy_controller_simulated_mining_value_today

      - type: history-graph
        title: Batterie – Ist gegen Simulation
        hours_to_show: 24
        entities:
          - entity: sensor.solax_inverter_battery_1_capacity
            name: Ist SOC
          - entity: sensor.solar_energy_controller_simulated_battery_soc
            name: Simulation SOC
